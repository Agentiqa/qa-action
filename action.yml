# Agentiqa QA — composite GitHub Action
#
# The versioned invocation contract for running your saved Agentiqa test plans
# in CI (nightly / release-gate) on Agentiqa Cloud. Wraps the published
# `agentiqa` npm CLI against the hosted engine:
#   AGENTIQA_SERVICE_KEY=... npx agentiqa@<cli-version> run --engine <url> [selectors]
#
# Output is captured via AG_OUTPUT=json (NOT the legacy --json flag): the CLI
# writes exactly one JSON envelope to stdout (schemaVersion:1) and all logs to
# stderr. See README.md for the envelope schema, the inputs/outputs, and the
# exit-code / fail-on gating contract.
#
# Optional QA review (`review: true`): after the run, the same job runs
#   npx agentiqa@<cli-version> review --batch <batch-run-id> --head <deployed-sha> [--since <sha>] --json
# against the caller's checkout (full history). Advisory only: it never changes
# the run outcome or the gate.
#
# This file is a published mirror of the action maintained in the Agentiqa
# monorepo; open an issue on this repo for questions or fixes.
name: 'Agentiqa — End-to-End Agentic QA in CI'
description: 'Release gates for your app and its AI agents: run your saved Agentiqa test plans against your live app, with results, videos and run links in your workflow.'
author: 'Agentiqa, Inc.'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  service-key:
    description: >-
      Project-scoped Agentiqa CLI service key (sk_...). Required. Mint one from
      the Agentiqa web app or desktop app (Project Settings -> CLI Service Keys ->
      Create Key) or via /api/cli-quickstart-key. Pass it from a repository
      secret; never inline.
    required: true
  api-url:
    description: >-
      Override the Agentiqa control-plane API URL (AGENTIQA_API_URL). Leave
      empty to use production (https://agentiqa.com), or set the URL of your
      own Agentiqa control plane.
    required: false
    default: ''
  runtime:
    description: >-
      Advanced. Where the execution engine runs; defaults to `cloud` — the
      browser runs on Agentiqa's infrastructure with the managed LLM and no
      Chromium on the runner. Leave unset for the standard hosted flow.
    required: false
    default: 'cloud'
  engine-url:
    description: >-
      Optional hosted-engine URL override; only meaningful with `runtime: cloud`.
      Leave empty for the default Agentiqa cloud engine
      (https://engine.agentiqa.com), or set the URL of your own hosted engine.
    required: false
    default: ''
  gemini-api-key:
    description: >-
      Advanced. Ignored for cloud runs, which use Agentiqa's managed LLM. When
      set, pass it from a repository secret.
    required: false
    default: ''
  plan-id:
    description: 'Run a single test plan by id (tplan_...). Overrides label-ids when set.'
    required: false
    default: ''
  label-ids:
    description: 'Comma-separated label ids; runs all plans tagged with any of them. Ignored when plan-id is set.'
    required: false
    default: ''
  mode:
    description: 'Execution order for the selected plans: sequential | parallel.'
    required: false
    default: 'sequential'
  cli-version:
    description: >-
      Version of the Agentiqa CLI to run: an npm dist-tag (latest, staging) or
      an exact semver (e.g. 1.4.2). Default latest.
    required: false
    default: 'latest'
  artifacts-dir:
    description: 'Directory (relative to the workspace) for run artifacts and the JSON result envelope.'
    required: false
    default: 'agentiqa-artifacts'
  fail-on:
    description: >-
      Exit-code gating policy. One of:
        never         - never fail the job on the run outcome (report-only; read outputs downstream).
        plan-failure  - (default) fail when a plan failed (exit 1), on a config/usage error
                        (exit 2 — permanent, must fail loudly), OR when a plan needs review
                        (outcome=needs-review: no step failed, but some step needs a person to
                        look at it before the run counts as passed — never a pass). Only
                        retryable infra errors (exit 3) are swallowed, surfacing as
                        outcome=infra-error for a digest/reporter to handle. Exit 3 also covers a
                        NO-VERDICT batch — one whose only non-passing plans could not reach a
                        verdict (a persistent engine disconnect, or the blocked cascade of one) —
                        so a transient WS drop no longer reads as a red plan-failure. Read the
                        `outcome` step output to gate more strictly (fail-on: any).
        any           - fail on any nonzero exit. Use for release gates.
    required: false
    default: 'plan-failure'
  node-version:
    description: 'Node.js version to set up on the runner (18+).'
    required: false
    default: '22'
  upload-artifacts:
    description: 'Upload the artifacts directory (screenshots/video/result JSON) as a build artifact.'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the uploaded artifact. Defaults to agentiqa-artifacts-<run_id>-<attempt> when empty.'
    required: false
    default: ''
  share-links:
    description: >-
      DEPRECATED no-op, accepted so existing workflows keep working. Public
      share links were retired 2026-07 in favor of org-member team access: the
      step summary's Details column always links a cloud run's detail page, and
      whoever opens it needs an Agentiqa login in the run owner's organization.
    required: false
    default: 'false'
  retention-days:
    description: >-
      Retention period (in days) for the uploaded artifact. Only applies when
      upload-artifacts is true. Defaults to 14; the repo/org artifact-retention
      cap still bounds it.
    required: false
    default: '14'
  review:
    description: >-
      true to have QA Manager review this run's batch after the run (default
      false). The review reads what changed in your repository since the last
      review and what this run saw, and leaves suggestions for a person to
      approve in Agentiqa: Update test?, Possible bug, Add test?. It runs after
      a red run too, and it never changes the run outcome or whether this job
      fails. It needs deployed-sha and a full-history checkout of your app's
      repository earlier in the job (actions/checkout with fetch-depth: 0), and
      the job's permissions should list both contents: read and pull-requests:
      read (a permissions block sets every scope it does not list to none, and
      the checkout needs contents: read). It runs on Agentiqa's managed model
      access, with the same service key.
    required: false
    default: 'false'
  deployed-sha:
    description: >-
      With review: true (required): the commit of your app that this run
      tested, i.e. the one deployed at the URL the plans ran against. A full or
      short sha, or a tag, present in the checkout. Not necessarily github.sha:
      a scheduled workflow runs on the tip of the default branch, which may not
      be what is deployed.
    required: false
    default: ''
  review-since:
    description: >-
      With review: true: the commit to start from for any plan that has no
      starting point of its own: a plan no review covered yet (every plan on
      the first review, and plans added later), and also a plan whose runs
      never reach a verdict. Without it such a plan stops the review
      (no_base). The review reads one set of changes for all plans, from the
      oldest starting point, so while any plan starts here the whole review
      reads everything since this commit. Keep it recent and move it forward,
      for example your latest release tag, not a fixed old one. A full or short
      sha, or a tag, present in the checkout.
    required: false
    default: ''
  review-dry-run:
    description: >-
      With review: true: true runs the review without saving anything (the
      CLI's --dry-run). The job summary and the review JSON show the cards it
      would leave; nothing reaches your Agentiqa project and no starting point
      moves forward. Use it for the first nights, then set it back to false.
    required: false
    default: 'false'

outputs:
  outcome:
    description: >-
      Run outcome bucket: passed | plan-failure | needs-review | config-error |
      infra-error. needs-review: no plan failed, and at least one plan has steps
      that need a person's review (CLI exit 3, envelope outcome needs-review) —
      not a pass, and not an infra error. Note: exit 0 with zero executed plans
      buckets as config-error (a run that tests nothing is not a pass).
    value: ${{ steps.run.outputs.outcome }}
  json-path:
    description: 'Path to the captured JSON result envelope (schemaVersion:1). Empty if the run was not attempted.'
    value: ${{ steps.run.outputs.json-path }}
  exit-code:
    description: 'Raw CLI process exit code (0 pass / 1 plan failure / 2 usage-config / 3 infra).'
    value: ${{ steps.run.outputs.exit-code }}
  plans-total:
    description: 'Total plans reported in the JSON envelope (empty if no envelope).'
    value: ${{ steps.run.outputs.plans-total }}
  plans-passed:
    description: 'Number of plans with outcome=passed.'
    value: ${{ steps.run.outputs.plans-passed }}
  plans-failed:
    description: 'Number of plans with outcome != passed.'
    value: ${{ steps.run.outputs.plans-failed }}
  artifact-name:
    description: 'Resolved artifact name used for the upload.'
    value: ${{ steps.run.outputs.artifact-name }}
  cli-resolved-version:
    description: >-
      The Agentiqa CLI version actually executed, resolved at run time from
      `agentiqa --version` (e.g. 1.1.32). Makes verdict drift across publishes
      attributable when cli-version is a floating dist-tag (latest/staging).
      Empty if capture failed or the run was not attempted.
    value: ${{ steps.run.outputs.cli-resolved-version }}
  batch-run-id:
    description: >-
      Id of the batch this run recorded (batch_...), the envelope's top-level
      batchRunId: what `agentiqa review --batch` takes. Empty when the run
      recorded no batch.
    value: ${{ steps.run.outputs.batch-run-id }}
  review-exit-code:
    description: >-
      Exit code of the QA review: 0 finished / 2 could not run (setup,
      permission or account limit; retrying will not help) / 3 did not finish
      (transient). Empty when review is off. Never changes outcome or the gate.
    value: ${{ steps.review.outputs.review-exit-code }}
  review-json-path:
    description: 'Path to the QA review JSON envelope (schemaVersion:1). Empty when the review did not run.'
    value: ${{ steps.review.outputs.review-json-path }}

runs:
  using: 'composite'
  steps:
    - name: Sanitize retention-days
      # upload-artifact fail-fasts on a non-numeric retention-days, and the
      # upload step runs under `if: always()` — an invalid override would
      # redden a job whose plans all passed. Coerce to a safe value up front;
      # runs first so the output exists on every later always() path.
      id: retention
      shell: bash
      env:
        RETENTION_DAYS: ${{ inputs.retention-days }}
      run: |
        days="${RETENTION_DAYS//[[:space:]]/}"
        if [ -z "$days" ]; then
          : # empty = defer to the repo/org default retention
        elif ! printf '%s' "$days" | grep -Eq '^[1-9][0-9]*$'; then
          echo "::warning::Invalid retention-days '${RETENTION_DAYS}' — falling back to 14."
          days=14
        fi
        echo "days=${days}" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run Agentiqa test plans
      id: run
      shell: bash
      env:
        # Auth + control-plane. AGENTIQA_SERVICE_KEY alone authenticates the
        # hosted engine (a short-lived credential is minted automatically).
        AGENTIQA_SERVICE_KEY: ${{ inputs.service-key }}
        # Exported to AGENTIQA_API_URL only when non-empty (same pattern as
        # gemini-api-key below). `api-url` defaults to '', and exporting that
        # empty value made AGENTIQA_API_URL *set-but-empty* in the CLI's
        # environment — every consumer that reads it with `||` shrugged it off,
        # but the batch-mint read used `??`, which treats '' as a real value, so
        # the PUT targeted a relative URL and silently unbatched the whole run.
        # The CLI read is fixed too; this keeps the Action from ever handing it
        # (or a job-level AGENTIQA_API_URL) an empty override again.
        INPUT_API_URL: ${{ inputs.api-url }}
        # Exported to GEMINI_API_KEY only when non-empty, so a job-level
        # GEMINI_API_KEY env var is not clobbered by an empty input.
        INPUT_GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        # Capture machine-readable output without the legacy --json flag.
        AG_OUTPUT: json
        CLI_VERSION: ${{ inputs.cli-version }}
        RUNTIME: ${{ inputs.runtime }}
        ENGINE_URL: ${{ inputs.engine-url }}
        PLAN_ID: ${{ inputs.plan-id }}
        LABEL_IDS: ${{ inputs.label-ids }}
        RUN_MODE: ${{ inputs.mode }}
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        DEFAULT_CLOUD_ENGINE_URL: 'https://engine.agentiqa.com'
      run: |
        set -uo pipefail

        # Emit a config-error outcome without running the CLI. The Gate step
        # below turns it into a job failure per the fail-on policy.
        fail_config() {
          echo "::error::$1"
          {
            echo "outcome=config-error"
            echo "exit-code=2"
            echo "json-path="
            echo "artifact-name="
            echo "plans-total="
            echo "plans-passed="
            echo "plans-failed="
            echo "cli-resolved-version="
            echo "batch-run-id="
          } >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [ -z "${AGENTIQA_SERVICE_KEY:-}" ]; then
          fail_config "service-key input is empty. Pass an Agentiqa CLI service key (sk_...) from a repository secret."
        fi

        # Only a non-empty api-url overrides the control plane. Unset stays
        # unset, so the CLI applies its own production default and a job-level
        # AGENTIQA_API_URL survives.
        if [ -n "$INPUT_API_URL" ]; then
          export AGENTIQA_API_URL="$INPUT_API_URL"
        fi

        case "$RUNTIME" in
          cloud|self-hosted) ;;
          *) fail_config "Invalid runtime '${RUNTIME}'. Expected one of: cloud | self-hosted." ;;
        esac

        if [ "$RUNTIME" = "self-hosted" ]; then
          if [ -n "$INPUT_GEMINI_API_KEY" ]; then
            export GEMINI_API_KEY="$INPUT_GEMINI_API_KEY"
          fi
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            fail_config "gemini-api-key is required when runtime: self-hosted (the in-process engine calls Gemini with your own key)."
          fi
          if [ -n "$ENGINE_URL" ]; then
            fail_config "engine-url is only meaningful with runtime: cloud. To target your own hosted engine, use runtime: cloud with engine-url."
          fi
        fi

        # Resolve artifacts dir to an absolute path and the JSON envelope target.
        mkdir -p "$ARTIFACTS_DIR"
        ARTIFACTS_ABS="$(cd "$ARTIFACTS_DIR" && pwd)"
        JSON_PATH="$ARTIFACTS_ABS/agentiqa-result.json"

        # Resolve artifact name (unique per run+attempt when not overridden).
        if [ -n "$INPUT_ARTIFACT_NAME" ]; then
          ARTIFACT_NAME="$INPUT_ARTIFACT_NAME"
        else
          ARTIFACT_NAME="agentiqa-artifacts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        fi

        # Build the argv. Cloud runtime adds --engine <url>; the in-process
        # runtime runs the engine locally. plan-id wins over label-ids.
        args=(run --artifacts-dir "$ARTIFACTS_ABS")
        if [ "$RUNTIME" = "cloud" ]; then
          args+=(--engine "${ENGINE_URL:-$DEFAULT_CLOUD_ENGINE_URL}")
        fi
        if [ -n "$PLAN_ID" ]; then
          args+=(--plan-id "$PLAN_ID")
        elif [ -n "$LABEL_IDS" ]; then
          args+=(--label-ids "$LABEL_IDS")
        fi
        if [ "$RUN_MODE" = "parallel" ]; then
          args+=(--mode parallel)
        fi
        # `share-links` is a retired no-op (#1803): public per-run links no
        # longer exist, so nothing is forwarded to the CLI. The input stays
        # declared so workflows that still set it don't fail validation.

        # Capture the RESOLVED CLI version for verdict attribution across
        # publishes: with a floating dist-tag (latest/staging) the same
        # workflow can silently run different CLI builds week to week, so we
        # record which one actually ran. `--version` writes exactly
        # "<version>\n" to stdout and exits before any run/analytics/update
        # output, so stdout is clean; this call also warms the npx cache the
        # run below reuses. Best-effort — never fail the run on a capture hiccup.
        CLI_RESOLVED_VERSION="$(npx -y "agentiqa@${CLI_VERSION}" --version 2>/dev/null | head -n1 | tr -d '[:space:]')"
        if [[ ! "$CLI_RESOLVED_VERSION" =~ ^[0-9][0-9A-Za-z.+_-]*$ ]]; then
          CLI_RESOLVED_VERSION=""
        fi
        echo "Resolved Agentiqa CLI: ${CLI_RESOLVED_VERSION:-unknown} (requested spec: agentiqa@${CLI_VERSION})"

        echo "Running: npx -y agentiqa@${CLI_VERSION} ${args[*]}"

        # AG_OUTPUT=json => one JSON envelope on stdout, logs on stderr.
        # Capture stdout to the envelope file; let stderr flow to the log.
        set +e
        npx -y "agentiqa@${CLI_VERSION}" "${args[@]}" > "$JSON_PATH"
        cli_exit_code="$?"
        set -e

        if [ -s "$JSON_PATH" ]; then
          echo "----- agentiqa-result.json -----"
          cat "$JSON_PATH"
          echo ""
          echo "--------------------------------"
        elif [ "$cli_exit_code" != "0" ]; then
          # Exit 0 without an envelope is handled below as a config-error;
          # this warning covers only nonzero exits that died before emitting.
          echo "::warning::No JSON envelope written (CLI exited ${cli_exit_code} before emitting output)."
        fi

        # Classify the outcome per the CLI exit-code contract (Decision 3 of
        # the wedge spec): 0=pass, 1=plan failure, 2=usage/config, 3=infra.
        # Unknown codes (e.g. signal deaths) are bucketed as config-error so
        # they fail loudly under the default policy.
        case "$cli_exit_code" in
          0) outcome="passed" ;;
          1) outcome="plan-failure" ;;
          3) outcome="infra-error" ;;
          *) outcome="config-error" ;;
        esac

        # Validate the envelope STRICTLY: stdout must be exactly one JSON
        # object (jq slurp mode). Doc-by-doc `jq .` would accept a polluted
        # multi-doc stream (stray log line + envelope) and let multiline
        # values leak into GITHUB_OUTPUT; junk-prefixed stdout must fail
        # validation rather than silently skip the guards. jq ships on
        # GitHub-hosted ubuntu runners.
        envelope_valid=""
        envelope_ok=""
        plans_total=""
        plans_passed=""
        plans_failed=""
        if command -v jq >/dev/null 2>&1; then
          if [ -s "$JSON_PATH" ] && jq -e -s 'length == 1 and (.[0] | type == "object")' "$JSON_PATH" >/dev/null 2>&1; then
            envelope_valid="yes"
            envelope_ok="$(jq -r -s 'if .[0].ok == true then "true" else "false" end' "$JSON_PATH")"
            plans_total="$(jq -r -s 'if (.[0].plans | type) == "array" then (.[0].plans | length) else "" end' "$JSON_PATH")"
            plans_passed="$(jq -r -s 'if (.[0].plans | type) == "array" then ([.[0].plans[] | select(.outcome == "passed")] | length) else "" end' "$JSON_PATH")"
            plans_failed="$(jq -r -s 'if (.[0].plans | type) == "array" then ([.[0].plans[] | select(.outcome != "passed")] | length) else "" end' "$JSON_PATH")"
          fi
        else
          echo "::warning::jq not found on the runner — cannot validate the result envelope."
        fi

        # Counts must be plain integers before they reach GITHUB_OUTPUT.
        [[ "$plans_total" =~ ^[0-9]+$ ]] || plans_total=""
        [[ "$plans_passed" =~ ^[0-9]+$ ]] || plans_passed=""
        [[ "$plans_failed" =~ ^[0-9]+$ ]] || plans_failed=""

        # Exit 3 is also how the CLI reports a batch whose plans need REVIEW: no plan failed,
        # but some step needs a person to look at it before the run counts as passed (the
        # envelope's top-level outcome is `needs-review`). That is a verdict, not a retryable
        # infra error, and never a pass: bucket it on its own so the gate can fail on it.
        # Without jq, or with polluted stdout (envelope_valid empty), the label is read from
        # the raw text instead: the CLI writes the top-level label only as `"outcome":
        # "needs-review"` (a per-plan outcome is `needs_review`, and an escaped copy inside a
        # string cannot match `"outcome"`). Skipping that read would bucket the batch as
        # infra-error and let the default policy pass it — amber folded into a CI pass.
        if [ "$cli_exit_code" = "3" ]; then
          if [ "$envelope_valid" = "yes" ]; then
            if [ "$(jq -r -s '.[0].outcome // ""' "$JSON_PATH")" = "needs-review" ]; then
              outcome="needs-review"
            fi
          elif [ -s "$JSON_PATH" ] && grep -Eq '"outcome"[[:space:]]*:[[:space:]]*"needs-review"' "$JSON_PATH"; then
            outcome="needs-review"
          fi
        fi

        # Exit 0 is only a pass when backed by a valid envelope: exactly one
        # JSON object with ok:true and a plans array. Missing stdout, polluted
        # stdout, ok:false, or a missing plans key would otherwise be a false
        # green. Fail-loud beats fail-silent.
        if [ "$cli_exit_code" = "0" ]; then
          if [ "$envelope_valid" != "yes" ] || [ "$envelope_ok" != "true" ] || [ -z "$plans_total" ]; then
            echo "::error::CLI exited 0 but produced no valid result envelope — treating as configuration error, not a pass."
            outcome="config-error"
          elif [ "$plans_total" = "0" ]; then
            # Zero-plans guard: an empty/wrong project or a selector matching
            # no plans must never turn a nightly green while testing nothing.
            echo "::error::CLI exited 0 but executed zero plans — a run that executes zero plans is a configuration error, not a pass. Check the service key's project and the plan-id/label-ids selectors."
            outcome="config-error"
          fi
        fi

        # The batch this invocation recorded (the envelope's TOP-LEVEL
        # `batchRunId`, omitted when no batch was minted): the handoff to
        # `agentiqa review --batch`. Without jq, or with polluted stdout, it is
        # read from the raw text the same way as needs-review above: the CLI
        # writes it only at the top level, and an escaped copy inside a string
        # cannot match `"batchRunId"`. Anything but a plain id is dropped.
        batch_run_id=""
        if [ "$envelope_valid" = "yes" ]; then
          batch_run_id="$(jq -r -s '.[0].batchRunId // "" | strings' "$JSON_PATH" 2>/dev/null | tr -d '\n\r')" || batch_run_id=""
        elif [ -s "$JSON_PATH" ]; then
          batch_run_id="$(grep -Eo '"batchRunId"[[:space:]]*:[[:space:]]*"[A-Za-z0-9_-]+"' "$JSON_PATH" | head -n1 | sed -E 's/.*"([A-Za-z0-9_-]+)"$/\1/')" || batch_run_id=""
        fi
        [[ "$batch_run_id" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || batch_run_id=""

        # GITHUB_OUTPUT is line-based: never write an unvalidated multiline
        # value there (a stray newline would inject bogus keys / corrupt the
        # file). Counts are regex-validated above; strings are checked here.
        emit_output() {
          local key="$1" value="$2"
          if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "::warning::Refusing to write multiline value for ${key} to GITHUB_OUTPUT; emitting empty."
            value=""
          fi
          echo "${key}=${value}" >> "$GITHUB_OUTPUT"
        }
        emit_output "outcome" "$outcome"
        emit_output "exit-code" "$cli_exit_code"
        emit_output "json-path" "$JSON_PATH"
        emit_output "artifact-name" "$ARTIFACT_NAME"
        emit_output "plans-total" "$plans_total"
        emit_output "plans-passed" "$plans_passed"
        emit_output "plans-failed" "$plans_failed"
        emit_output "cli-resolved-version" "$CLI_RESOLVED_VERSION"
        emit_output "batch-run-id" "$batch_run_id"

        echo "Agentiqa run outcome=${outcome} (cli exit ${cli_exit_code}); plans total=${plans_total:-?} passed=${plans_passed:-?} failed=${plans_failed:-?}; agentiqa=${CLI_RESOLVED_VERSION:-unknown}"

        # This step never fails on the CLI outcome — the Gate step below owns
        # policy so that artifact upload always runs first.
        exit 0

    - name: Render step summary + annotations
      # Human-readable results in the Actions UI: a per-plan table (outcome,
      # run deep link, failure reason) written to the
      # job step summary, plus a ::error annotation per failed plan so failures
      # surface in the run UI and PR checks — no log-digging or artifact download
      # needed. The Reason column carries the short cause on the failing row
      # itself, so there is no separate failures list below the table.
      # Reads only the schemaVersion:1 envelope; no secret is ever referenced.
      if: ${{ always() }}
      shell: bash
      env:
        JSON_PATH: ${{ steps.run.outputs.json-path }}
        OUTCOME: ${{ steps.run.outputs.outcome }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        PLANS_TOTAL: ${{ steps.run.outputs.plans-total }}
        PLANS_PASSED: ${{ steps.run.outputs.plans-passed }}
        ARTIFACT_NAME: ${{ steps.run.outputs.artifact-name }}
        UPLOAD_ARTIFACTS: ${{ inputs.upload-artifacts }}
        CLI_RESOLVED_VERSION: ${{ steps.run.outputs.cli-resolved-version }}
      run: |
        set -uo pipefail
        # Character-based (not byte-based) ${var:0:180} truncation: container
        # jobs often run with no locale set, where bash slices multibyte
        # UTF-8 mid-sequence. C.UTF-8 ships with glibc >= 2.35 everywhere.
        export LC_ALL=C.UTF-8 2>/dev/null || true
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
        emit() { printf '%s\n' "$1" >> "$SUMMARY"; }

        # One compact brand+stat line instead of a heading: GitHub already
        # titles this block "<job name> summary", so an H2 only repeated the
        # attribution. CLI exit code is deliberately absent — it means nothing
        # to a human reading the summary (annotations still carry it for CI
        # debugging); `outcome` is the human word for how the invocation ended.
        ver_suffix=""
        [ -n "${CLI_RESOLVED_VERSION:-}" ] && ver_suffix=" · \`v${CLI_RESOLVED_VERSION}\`"
        emit "**Agentiqa** · **${PLANS_PASSED:-?} / ${PLANS_TOTAL:-?} plans passed** · outcome \`${OUTCOME:-unknown}\`${ver_suffix}"

        # Batch page link (the envelope's optional TOP-LEVEL `batchUrl`): one
        # click from the check to every run of this CI invocation, grouped on
        # the hosted batch page. Emitted directly under the stat line so it
        # is reachable even when the table below is skipped. Present only when
        # the CLI minted a batch row against a hosted control plane; the same
        # http(s) guard as the per-plan Details cell keeps a malformed or
        # self-hosted value out of the summary. Read defensively — a runner
        # without jq or an unparseable envelope just omits the line, and the
        # fuller guards below still emit their own explanation.
        batch_url=""
        if command -v jq >/dev/null 2>&1 && [ -n "${JSON_PATH:-}" ] && [ -s "${JSON_PATH:-}" ]; then
          batch_url="$(jq -r -s \
            'if (length==1 and (.[0]|type=="object")) then (.[0].batchUrl // "") else "" end' \
            "$JSON_PATH" 2>/dev/null | tr -d '\n\r')" || batch_url=""
        fi
        batch_link_emitted=""
        case "$batch_url" in
          http://*|https://*)
            emit ""
            emit "[**View full results ↗**](${batch_url}) — all runs of this invocation with screenshots, video and step-by-step reasons. Available to every member of your Agentiqa org."
            batch_link_emitted="1"
            ;;
        esac
        emit ""

        if ! command -v jq >/dev/null 2>&1; then
          emit "> \`jq\` not available on the runner — per-plan table skipped."
          exit 0
        fi

        # Only render from a strictly-valid single-object envelope.
        if [ -z "${JSON_PATH:-}" ] || [ ! -s "${JSON_PATH:-}" ] \
           || ! jq -e -s 'length==1 and (.[0]|type=="object")' "$JSON_PATH" >/dev/null 2>&1; then
          emit "> No valid result envelope was produced for this run — see the job log."
          exit 0
        fi

        # Failure envelope (ok:false): show the error, annotate, stop.
        if [ "$(jq -r -s '.[0].ok' "$JSON_PATH")" = "false" ]; then
          code="$(jq -r -s '.[0].error.code // "error"' "$JSON_PATH")"
          msg="$(jq -r -s '.[0].error.message // ""' "$JSON_PATH" | tr '\n\r' '  ')"
          emit "> **Run error (\`${code}\`):** ${msg}"
          echo "::error title=Agentiqa run error::${code}: ${msg}"
          exit 0
        fi

        emit "| Plan | Outcome | Details | Reason |"
        emit "| --- | --- | --- | --- |"

        n="$(jq -r -s '.[0].plans | length' "$JSON_PATH")"
        [[ "$n" =~ ^[0-9]+$ ]] || n=0
        i=0
        while [ "$i" -lt "$n" ]; do
          title="$(jq -r -s --argjson i "$i" '.[0].plans[$i].title // "(untitled)"' "$JSON_PATH")"
          pout="$(jq -r -s --argjson i "$i" '.[0].plans[$i].outcome // "?"' "$JSON_PATH")"
          rurl="$(jq -r -s --argjson i "$i" '.[0].plans[$i].runUrl // ""' "$JSON_PATH")"
          psum="$(jq -r -s --argjson i "$i" '.[0].plans[$i].summary // ""' "$JSON_PATH")"

          # A plan that needs review did not fail: warning tone, never the failed mark.
          case "$pout" in
            passed) icon="✅&nbsp;passed" ;;
            needs_review) icon="⚠️&nbsp;needs&nbsp;review" ;;
            *) icon="❌&nbsp;${pout}" ;;
          esac
          # Details column: the run-detail deep link (video, steps, evidence
          # live there), opened by org members of the run owner (team access,
          # #1803 — public share links are gone). Link only a public http(s)
          # URL — cloud runs only; "–" for embedded/self-hosted.
          case "$rurl" in
            http://*|https://*) rcell="[open ↗](${rurl})" ;;
            *) rcell="–" ;;
          esac
          safe_title="$(printf '%s' "$title" | sed 's/|/\\|/g')"

          # Reason column: the short failure cause on the row itself. Only for
          # non-passed plans — passed rows show "–" so the table stays scannable.
          # The ::error annotation below carries the UNTRUNCATED reason; the cell
          # is capped at 180 chars because the full context is one click away in
          # the run.
          reason_cell="–"
          if [ "$pout" != "passed" ]; then
            reason="$psum"
            [ -z "$reason" ] && reason="Plan '${title}' outcome=${pout}"
            reason="$(printf '%s' "$reason" | tr '\n\r' '  ')"
            if [ "$pout" = "needs_review" ]; then
              echo "::warning title=Agentiqa plan needs review: ${title}::${reason}"
            else
              echo "::error title=Agentiqa plan failed: ${title}::${reason}"
            fi
            short="${reason:0:180}"
            [ "${#reason}" -gt 180 ] && short="${short}…"
            reason_cell="$(printf '%s' "$short" | sed 's/|/\\|/g')"
          fi

          emit "| ${safe_title} | ${icon} | ${rcell} | ${reason_cell} |"
          i=$((i + 1))
        done

        # Artifact note: when the batch link is present it already offers the
        # media online, so the artifact drops to a quiet one-liner; without a
        # batch link (self-hosted / batch not minted) the artifact is the only
        # media source and keeps the full sentence.
        if [ "${UPLOAD_ARTIFACTS:-}" = "true" ] && [ -n "${ARTIFACT_NAME:-}" ]; then
          emit ""
          if [ -n "$batch_link_emitted" ]; then
            emit "<sub>Offline copy: \`result.json\` + media in artifact **${ARTIFACT_NAME}**.</sub>"
          else
            emit "_Screenshots, video and \`result.json\`: download the **${ARTIFACT_NAME}** artifact from this run._"
          fi
        fi

    - name: Review the batch (QA Manager)
      # Optional (`review: true`). QA Manager reviews AFTER the run: what
      # changed in the caller's checkout between the last reviewed commit and
      # `deployed-sha`, plus what this batch saw, and leaves suggestions a
      # person approves in Agentiqa. Advisory: this step always exits 0 and
      # never touches the run outcome or the gate below; its result is the
      # review-* outputs and a section of the job summary. It runs after a red
      # run too; `!cancelled()` keeps a cancelled job from starting a review.
      # Placed before the upload so the review files ship in the artifact.
      id: review
      if: ${{ !cancelled() && inputs.review == 'true' }}
      shell: bash
      env:
        AGENTIQA_SERVICE_KEY: ${{ inputs.service-key }}
        INPUT_API_URL: ${{ inputs.api-url }}
        # Read-only use: the pull requests behind the reviewed commits (the
        # caller's job grants `pull-requests: read`).
        GITHUB_TOKEN: ${{ github.token }}
        CLI_VERSION: ${{ inputs.cli-version }}
        BATCH_RUN_ID: ${{ steps.run.outputs.batch-run-id }}
        DEPLOYED_SHA: ${{ inputs.deployed-sha }}
        REVIEW_SINCE: ${{ inputs.review-since }}
        REVIEW_DRY_RUN: ${{ inputs.review-dry-run }}
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
      run: |
        # No errexit (`shell: bash` starts with -e): a review that exits
        # nonzero is reported below, and every path ends in finish(), exit 0.
        set +e
        set -uo pipefail
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

        # The review's model calls run on Agentiqa's managed access for the
        # service key's account. The CLI prefers GEMINI_API_KEY when it is set,
        # so a job-level value would move the review onto the caller's key:
        # it never reaches the review.
        unset GEMINI_API_KEY

        # Same rule as the run step: only a non-empty api-url overrides.
        if [ -n "$INPUT_API_URL" ]; then
          export AGENTIQA_API_URL="$INPUT_API_URL"
        fi

        # Outputs, then end the step: the review never fails the job.
        finish() {
          echo "review-exit-code=$1" >> "$GITHUB_OUTPUT"
          echo "review-json-path=$2" >> "$GITHUB_OUTPUT"
          exit 0
        }
        # A review that could not start: one warning, one summary line, and
        # exit code 2 (the CLI's code for a setup problem a retry cannot fix).
        not_started() {
          echo "::warning title=Agentiqa QA review::The review did not run: $1"
          printf '\n> **QA review did not run:** %s\n' "$1" >> "$SUMMARY"
          finish 2 ""
        }
        # An input value as a message may quote it: one line, bounded.
        shown() { printf '%s' "$1" | tr -d '\n\r' | cut -c1-80; }
        # A full or short sha, a tag or a ref -> the full commit sha the CLI
        # takes; empty when this checkout does not have it. A leading dash
        # (an option to git) or whitespace is never a commit.
        commit_of() {
          case "$1" in
            -*|*[[:space:]]*) return 0 ;;
          esac
          git rev-parse --verify --quiet "$1^{commit}" 2>/dev/null || true
        }

        if [ -z "${AGENTIQA_SERVICE_KEY:-}" ]; then
          not_started "service-key is empty."
        fi
        if [[ ! "$BATCH_RUN_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]]; then
          not_started "the run recorded no batch to review (batch-run-id is empty). See the run step above."
        fi
        if [ -z "$DEPLOYED_SHA" ]; then
          not_started "review: true needs deployed-sha, the commit of your app this run tested."
        fi
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          not_started "the workspace is not a git checkout. Check out your app's repository (actions/checkout with fetch-depth: 0) before this action."
        fi
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          echo "::warning title=Agentiqa QA review::This checkout is shallow. The review reads the history between the last reviewed commit and deployed-sha: use actions/checkout with fetch-depth: 0."
        fi

        HEAD_SHA="$(commit_of "$DEPLOYED_SHA")"
        if [ -z "$HEAD_SHA" ]; then
          not_started "deployed-sha '$(shown "$DEPLOYED_SHA")' is not a commit in this checkout. Check out the repository your app is deployed from, with full history (fetch-depth: 0)."
        fi
        SINCE_SHA=""
        if [ -n "$REVIEW_SINCE" ]; then
          SINCE_SHA="$(commit_of "$REVIEW_SINCE")"
          if [ -z "$SINCE_SHA" ]; then
            not_started "review-since '$(shown "$REVIEW_SINCE")' is not a commit in this checkout (fetch-depth: 0)."
          fi
        fi

        mkdir -p "$ARTIFACTS_DIR"
        ARTIFACTS_ABS="$(cd "$ARTIFACTS_DIR" && pwd)"
        REVIEW_JSON="$ARTIFACTS_ABS/agentiqa-review.json"
        REVIEW_MD="$ARTIFACTS_ABS/agentiqa-review-summary.md"
        rm -f "$REVIEW_MD"

        rargs=(review --batch "$BATCH_RUN_ID" --head "$HEAD_SHA" --summary "$REVIEW_MD" --json)
        if [ -n "$SINCE_SHA" ]; then
          rargs+=(--since "$SINCE_SHA")
        fi
        # review-dry-run: the cards it would leave, nothing saved (shadow nights).
        dry_note=""
        if [ "${REVIEW_DRY_RUN:-}" = "true" ]; then
          rargs+=(--dry-run)
          dry_note=" (dry run: nothing was saved)"
        fi

        echo "Running: npx -y agentiqa@${CLI_VERSION} ${rargs[*]}"
        # --json => one envelope on stdout (kept as a file), logs on stderr.
        npx -y "agentiqa@${CLI_VERSION}" "${rargs[@]}" > "$REVIEW_JSON"
        review_exit="$?"

        if [ "$review_exit" = "0" ]; then
          echo "Agentiqa QA review finished${dry_note}. Envelope: ${REVIEW_JSON}"
          # The review's own job-summary section (its cards, with links), under the run table.
          if [ -s "$REVIEW_MD" ]; then
            { echo ""; cat "$REVIEW_MD"; echo ""; } >> "$SUMMARY"
          fi
          finish 0 "$REVIEW_JSON"
        fi

        # Not finished: name the failure envelope's code and message (read
        # defensively: without jq or a valid envelope, the log has the detail).
        err_code=""
        err_msg=""
        if command -v jq >/dev/null 2>&1 && [ -s "$REVIEW_JSON" ] \
           && jq -e -s 'length==1 and (.[0]|type=="object") and .[0].ok==false' "$REVIEW_JSON" >/dev/null 2>&1; then
          err_code="$(jq -r -s '.[0].error.code // ""' "$REVIEW_JSON" 2>/dev/null | tr -d '\n\r')" || err_code=""
          err_msg="$(jq -r -s '.[0].error.message // ""' "$REVIEW_JSON" 2>/dev/null | tr '\n\r' '  ' | cut -c1-500)" || err_msg=""
        fi
        case "$review_exit" in
          2) what="could not run (exit 2)"; why=" A setup, permission or account problem: a retry will not fix it." ;;
          3) what="did not finish (exit 3)"; why=" A transient failure: safe to retry." ;;
          *) what="ended with exit ${review_exit}"; why="" ;;
        esac
        hint=""
        case "$err_code" in
          no_base) hint=" Set review-since to the commit where plans that no review covered yet start (every plan on the first review)." ;;
          head_missing) hint=" Check out the repository your app is deployed from with fetch-depth: 0." ;;
        esac
        detail="${err_code:+${err_code}: }${err_msg}"
        [ -n "$detail" ] || detail="See the step log."
        echo "::warning title=Agentiqa QA review::The review ${what}. ${detail}${hint}${why}"
        printf '\n> **QA review %s.** %s%s%s\n' "$what" "$(printf '%s' "$detail" | sed 's/|/\\|/g')" "$hint" "$why" >> "$SUMMARY"
        if [ -s "$REVIEW_JSON" ]; then
          finish "$review_exit" "$REVIEW_JSON"
        fi
        finish "$review_exit" ""

    - name: Upload Agentiqa artifacts
      if: ${{ always() && inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.run.outputs.artifact-name || 'agentiqa-artifacts' }}
        path: ${{ inputs.artifacts-dir }}
        if-no-files-found: warn
        retention-days: ${{ steps.retention.outputs.days }}

    - name: Gate on outcome
      shell: bash
      env:
        OUTCOME: ${{ steps.run.outputs.outcome }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
        JSON_PATH: ${{ steps.run.outputs.json-path }}
      run: |
        set -euo pipefail

        case "$FAIL_ON" in
          never|plan-failure|any) ;;
          *)
            echo "::error::Invalid fail-on value '${FAIL_ON}'. Expected one of: never | plan-failure | any."
            exit 2
            ;;
        esac

        echo "Gating with fail-on=${FAIL_ON}; outcome=${OUTCOME} (cli exit ${EXIT_CODE})."

        # Policy matrix:
        #   never        -> report-only, never fails.
        #   plan-failure -> fails on plan-failure, needs-review AND config-error
        #                   (permanent problems must fail loudly, and a run that
        #                   needs review is not a pass); swallows ONLY the
        #                   retryable infra-error bucket (exit 3).
        #   any          -> fails on any nonzero outcome.
        case "$OUTCOME" in
          passed)
            echo "All selected plans passed."
            exit 0
            ;;
          plan-failure)
            if [ "$FAIL_ON" = "never" ]; then
              echo "::warning::A plan failed (exit ${EXIT_CODE}), but fail-on=never — not failing the job."
              exit 0
            fi
            echo "::error::A plan failed (cli exit ${EXIT_CODE})."
            exit 1
            ;;
          needs-review)
            if [ "$FAIL_ON" = "never" ]; then
              echo "::warning::A plan needs review (cli exit ${EXIT_CODE}), but fail-on=never — not failing the job."
              exit 0
            fi
            echo "::error::A plan needs review (cli exit ${EXIT_CODE}): no step failed, but some step needs a person to look at it before the run counts as passed. Open the run to review it."
            exit 1
            ;;
          config-error)
            if [ "$FAIL_ON" = "never" ]; then
              echo "::warning::Config/usage error (cli exit ${EXIT_CODE}), but fail-on=never — not failing the job."
              exit 0
            fi
            # An account / plan-limit block is exit 2 too, but no workflow edit
            # can clear it. The CLI keeps the server's quota reason as the
            # failure envelope's error.code, so name the real fix instead of
            # pointing at the workflow inputs. Read defensively: a missing jq or
            # an invalid envelope falls back to the generic message. The CLI's
            # own error.message is already in the "Agentiqa run error"
            # annotation from the summary step, so it is not repeated here.
            err_code=""
            if command -v jq >/dev/null 2>&1 && [ -n "${JSON_PATH:-}" ] && [ -s "${JSON_PATH:-}" ] \
               && jq -e -s 'length==1 and (.[0]|type=="object") and .[0].ok==false' "$JSON_PATH" >/dev/null 2>&1; then
              err_code="$(jq -r -s '.[0].error.code // ""' "$JSON_PATH" 2>/dev/null | tr -d '\n\r')" || err_code=""
            fi
            case "$err_code" in
              org_cap_exhausted)
                echo "::error::Your organization's Agentiqa run credits are used up or have expired (org_cap_exhausted, cli exit ${EXIT_CODE}). This is account state, not a workflow problem: re-running the job or changing its inputs won't help. Contact Agentiqa support to renew the credits. (If the run error above says to ask your organization admin to raise the limit, that is older CLI wording: organization credits are renewed by Agentiqa, not by an admin.)"
                ;;
              credits_exhausted)
                echo "::error::This account's included Agentiqa usage and credit balance are used up (credits_exhausted, cli exit ${EXIT_CODE}). This is account state, not a workflow problem: re-running the job won't help. Upgrade the plan (or buy credits where your plan offers them) from the limit dialog in the Agentiqa web app, or wait for the next monthly window."
                ;;
              trial_limit|overage_required|overage_cap_reached|no_managed_entitlement|revoked)
                echo "::error::Agentiqa account or plan limit (${err_code}, cli exit ${EXIT_CODE}) — account state, not a workflow problem; re-running the job won't help. The \"Agentiqa run error\" annotation has the details."
                ;;
              *)
                echo "::error::Config/usage error (cli exit ${EXIT_CODE}) — permanent; fix the workflow inputs, service key, or plan selectors."
                ;;
            esac
            exit 1
            ;;
          infra-error)
            if [ "$FAIL_ON" = "any" ]; then
              echo "::error::Infra/runtime error (cli exit ${EXIT_CODE})."
              exit 1
            fi
            echo "::warning::Retryable infra error (cli exit ${EXIT_CODE}); fail-on=${FAIL_ON} does not gate on it. Inspect the outcome output / artifacts."
            exit 0
            ;;
          *)
            echo "::error::Unknown outcome '${OUTCOME}'."
            exit 1
            ;;
        esac
